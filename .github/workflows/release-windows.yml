name: Release Windows
run-name: ${{ inputs.recovery && 'Recover Windows' || 'Release Windows' }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (e.g. v1.2.9)'
        required: true
        type: string
      recovery:
        description: 'Build an existing tag using this branch workflow and repair legacy test driver paths'
        type: boolean
        default: false
      source_sha:
        description: 'Expected existing tag commit (required for recovery)'
        type: string
      diagnostic_only:
        description: 'Run all build and test gates without publishing installers or signatures'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-windows-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    # Pin the desktop environment; image migrations must pass the smoke preflight first.
    runs-on: windows-2022
    outputs:
      source-sha: ${{ steps.provenance.outputs.source_sha }}
      installer-digests: ${{ steps.provenance.outputs.digests }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # Diagnostics can validate an unpublished harness fix without changing a release tag.
          ref: ${{ inputs.diagnostic_only && inputs.source_sha || inputs.tag }}
      - name: Validate release tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RECOVERY: ${{ inputs.recovery }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid stable release tag' }
          if ($env:DIAGNOSTIC_ONLY -eq 'true' -and $env:RECOVERY -ne 'true') { throw 'Diagnostics require recovery mode with a pinned source SHA' }
          if ($env:RECOVERY -eq 'true') {
            if ($env:GITHUB_REF -notlike 'refs/heads/*') { throw 'Recovery must use a workflow branch' }
            if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Recovery requires the expected tag commit' }
            if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Release tag changed after the request; refusing to publish' }
          } elseif ($env:GITHUB_REF -ne "refs/tags/$env:RELEASE_TAG") { throw 'Dispatch must use the release tag as its ref' }
          $version = $env:RELEASE_TAG.Substring(1)
          foreach ($path in @('package.json', 'src-tauri/tauri.conf.json')) {
            if ((Get-Content $path -Raw | ConvertFrom-Json).version -ne $version) { throw "Version mismatch in $path" }
          }
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch ('(?m)^version\s*=\s*"' + [regex]::Escape($version) + '"\s*$')) { throw 'Rust package version mismatch' }
      - name: Repair legacy test driver paths for recovery
        if: ${{ inputs.recovery }}
        run: |
          $file = 'e2e/harness.mjs'
          $source = [IO.File]::ReadAllText($file)
          $pattern = '(?m)^const CARGO_BIN = "[^"\r\n]+";\r?$'
          $matches = [regex]::Matches($source, $pattern)
          if ($matches.Count -eq 1) {
            $replacement = 'const CARGO_BIN = path.join(process.env.CARGO_HOME || path.join(process.env.USERPROFILE, ".cargo"), "bin");'
            [IO.File]::WriteAllText($file, [regex]::Replace($source, $pattern, $replacement), [Text.UTF8Encoding]::new($false))
            Write-Host 'Repaired only the legacy E2E driver directory; application sources are unchanged.'
          } elseif ($source -notmatch 'const CARGO_BIN = cargoBin\(\);') {
            throw 'Unrecognized harness driver setup; refusing an unverified repair'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Install RustSec scanner
        run: cargo install cargo-audit --locked
      - name: Dependency security policy tests
        run: node --test tools/dependency-security-policy.test.mjs tools/browser-download-contract.test.mjs
      - name: Verify signed updater release contracts
        if: ${{ !inputs.recovery }}
        run: node --test tools/update-signing.test.mjs tools/update-signing-workflow.test.mjs
      - name: Audit dependencies for x86_64-pc-windows-msvc
        env:
          VAULTSPEND_AUDIT_OUTPUT: dependency-audit/x86_64-pc-windows-msvc
        run: node tools/audit-dependencies.mjs x86_64-pc-windows-msvc
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-release-windows
          path: dependency-audit/
          if-no-files-found: error
      - name: Frontend tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build frontend for Rust tests
        run: npm run build
      - name: Rust tests
        run: cargo test --workspace
      - name: Build E2E database fixture tool
        run: cargo build -p budget_core --bin init_db
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install E2E browsers
        run: npx playwright install chromium firefox webkit
      - name: Install desktop test drivers
        run: |
          cargo install tauri-driver --locked
          if ($LASTEXITCODE -ne 0) { throw 'tauri-driver installation failed' }
          $root = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          $runtime = Get-ChildItem $root -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 runtime not found' }
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$($runtime.Name)/edgedriver_win64.zip" -OutFile $zip
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          Expand-Archive $zip -DestinationPath (Join-Path $cargoHome 'bin') -Force
      - name: Build current desktop test app
        run: npx tauri build --debug --no-bundle
      - name: Desktop WebDriver smoke preflight
        run: npm run e2e:smoke
      - name: Full desktop E2E release gate
        run: npm run e2e
      - name: Build and publish Windows installers
        if: ${{ !inputs.diagnostic_only }}
        id: package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Vault Spend ${{ inputs.tag }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
      - name: Record final Windows build provenance
        if: ${{ !inputs.recovery && !inputs.diagnostic_only }}
        id: provenance
        env:
          ARTIFACT_PATHS: ${{ steps.package.outputs.artifactPaths }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node tools/update-build-provenance.mjs windows-x86_64 $env:RELEASE_TAG.Substring(1)

  sign-updates:
    if: ${{ !inputs.recovery && !inputs.diagnostic_only }}
    needs: release
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.source-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download final Windows release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          mkdir "$RUNNER_TEMP/update-input"
          gh release download "$RELEASE_TAG" --repo OneTrueAsian/vault-spend --dir "$RUNNER_TEMP/update-input" --pattern "Vault.Spend_${RELEASE_TAG#v}_x64-setup.exe" --pattern "Vault.Spend_${RELEASE_TAG#v}_x64_en-US.msi"
      - name: Sign exact final Windows bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VAULTSPEND_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          VAULTSPEND_UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
          VAULTSPEND_UPDATE_SIGNING_KEY_ID: ${{ vars.UPDATE_SIGNING_KEY_ID }}
          VAULTSPEND_UPDATE_EXPECTED_DIGESTS: ${{ needs.release.outputs.installer-digests }}
        run: node tools/update-signing.mjs sign windows-x86_64 "${RELEASE_TAG#v}" "$RUNNER_TEMP/update-signed" "$RUNNER_TEMP/update-input/Vault.Spend_${RELEASE_TAG#v}_x64-setup.exe" "$RUNNER_TEMP/update-input/Vault.Spend_${RELEASE_TAG#v}_x64_en-US.msi"
      - name: Publish immutable Windows manifests and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" --repo OneTrueAsian/vault-spend "$RUNNER_TEMP/update-signed/"*.json
