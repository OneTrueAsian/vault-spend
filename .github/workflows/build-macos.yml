name: Build macOS

# Builds an unsigned, universal (Intel + Apple Silicon) macOS bundle and
# attaches it to a GitHub Release — Tauri apps have to be built on macOS
# itself (the WebView layer isn't cross-compilable from Windows), so this
# runs on a GitHub-hosted macOS runner instead. Unsigned means Gatekeeper
# will block a plain double-click; whoever installs it needs to right-click
# the .app and choose "Open" the first time (or clear the quarantine flag
# via `xattr -d com.apple.quarantine`), similar in spirit to the Windows
# SmartScreen note already included with the Windows installers.
#
# Started manually by the release tool or the Actions Run workflow button.
# Tag pushes do not start a second publishing build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the macOS bundle to (e.g. v1.1.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-macos-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    outputs:
      source-sha: ${{ steps.provenance.outputs.source_sha }}
      installer-digests: ${{ steps.provenance.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
      - name: Install RustSec scanner
        run: cargo install cargo-audit --locked
      - name: Dependency security policy tests
        run: node --test tools/dependency-security-policy.test.mjs tools/browser-download-contract.test.mjs
      - name: Verify signed updater release contracts
        run: node --test tools/update-signing.test.mjs tools/update-signing-workflow.test.mjs
      - name: Audit dependencies for aarch64-apple-darwin
        env:
          VAULTSPEND_AUDIT_OUTPUT: dependency-audit/aarch64-apple-darwin
        run: node tools/audit-dependencies.mjs aarch64-apple-darwin
      - name: Audit dependencies for x86_64-apple-darwin
        env:
          VAULTSPEND_AUDIT_OUTPUT: dependency-audit/x86_64-apple-darwin
        run: node tools/audit-dependencies.mjs x86_64-apple-darwin
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-build-macos
          path: dependency-audit/
          if-no-files-found: error

      - name: Build and attach macOS bundle
        id: package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Vault Spend ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
      - name: Record final macOS build provenance
        id: provenance
        env:
          ARTIFACT_PATHS: ${{ steps.package.outputs.artifactPaths }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node tools/update-build-provenance.mjs macos-universal "${RELEASE_TAG#v}"

  sign-updates:
    needs: build-macos
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-macos.outputs.source-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download final macOS release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          mkdir "$RUNNER_TEMP/update-input"
          gh release download "$RELEASE_TAG" --repo OneTrueAsian/vault-spend --dir "$RUNNER_TEMP/update-input" --pattern "Vault.Spend_${RELEASE_TAG#v}_universal.dmg"
      - name: Sign exact final macOS bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VAULTSPEND_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          VAULTSPEND_UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
          VAULTSPEND_UPDATE_SIGNING_KEY_ID: ${{ vars.UPDATE_SIGNING_KEY_ID }}
          VAULTSPEND_UPDATE_EXPECTED_DIGESTS: ${{ needs.build-macos.outputs.installer-digests }}
        run: node tools/update-signing.mjs sign macos-universal "${RELEASE_TAG#v}" "$RUNNER_TEMP/update-signed" "$RUNNER_TEMP/update-input/"*
      - name: Publish immutable macOS manifest and signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" --repo OneTrueAsian/vault-spend "$RUNNER_TEMP/update-signed/"*.json
