name: macOS build check

# Builds and tests Vault Spend on a GitHub-hosted macOS runner WITHOUT touching any
# tag or release. Unlike build-macos.yml (which publishes a release), this only
# proves a change works on macOS before it is released: it runs the Rust tests and
# builds the universal bundle, then uploads the .dmg as a workflow artifact that can
# be downloaded from the run page. Read-only token, so it cannot publish anything.
#
# Runs on manual dispatch ("Run workflow") and on pushes to the branches below.

on:
  workflow_dispatch:
    inputs:
      prepare_signed:
        description: 'Prepare signed 1.3.1 Windows and macOS installers as artifacts; no publication'
        type: boolean
        default: false
      source_sha:
        description: 'Exact release-1.3.1 commit, required for signed preparation'
        type: string
      sign_prepared_run:
        description: 'Sign an already validated preparation run without rebuilding or publishing'
        type: string
  push:
    branches:
      - profile-password-protection

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-check-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.prepare_signed && !inputs.sign_prepared_run }}

jobs:
  macos-check:
    if: ${{ !inputs.prepare_signed && !inputs.sign_prepared_run }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
      - name: Install RustSec scanner
        run: cargo install cargo-audit --locked
      - name: Dependency security policy tests
        run: node --test tools/dependency-security-policy.test.mjs tools/browser-download-contract.test.mjs
      - name: Audit dependencies for aarch64-apple-darwin
        env:
          VAULTSPEND_AUDIT_OUTPUT: dependency-audit/aarch64-apple-darwin
        run: node tools/audit-dependencies.mjs aarch64-apple-darwin
      - name: Audit dependencies for x86_64-apple-darwin
        env:
          VAULTSPEND_AUDIT_OUTPUT: dependency-audit/x86_64-apple-darwin
        run: node tools/audit-dependencies.mjs x86_64-apple-darwin
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-build-macos-check
          path: dependency-audit/
          if-no-files-found: error

      # The Tauri crate embeds the built frontend, so it has to exist before the
      # Rust workspace compiles.
      - name: Build the frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --workspace

      - name: Build the universal macOS bundle (not released)
        run: npx tauri build --target universal-apple-darwin

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: vault-spend-macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  prepare-signed:
    if: ${{ inputs.prepare_signed && !inputs.sign_prepared_run }}
    uses: ./.github/workflows/prepare-signed-installers.yml
    secrets:
      UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
      UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
    with:
      source_sha: ${{ inputs.source_sha }}

  validate-prepared:
    if: ${{ inputs.sign_prepared_run }}
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.validate.outputs.source_sha }}
      windows-digests: ${{ steps.validate.outputs.windows_digests }}
      macos-digests: ${{ steps.validate.outputs.macos_digests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tools/validate-prepared-build.test.mjs tools/prepare-update-artifacts.test.mjs tools/update-signing-workflow.test.mjs
      - name: Validate existing packaging gates and recorded byte hashes
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARED_RUN_ID: ${{ inputs.sign_prepared_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREPARE_SIGNED: ${{ inputs.prepare_signed }}
        run: node tools/validate-prepared-build.mjs

  sign-prepared:
    needs: validate-prepared
    runs-on: ubuntu-latest
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x86_64, macos-universal]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-prepared.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: prepared-input
          run-id: ${{ inputs.sign_prepared_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign exact validated installer bytes
        env:
          VAULTSPEND_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          VAULTSPEND_UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
          VAULTSPEND_UPDATE_SIGNING_KEY_ID: ${{ vars.UPDATE_SIGNING_KEY_ID }}
          VAULTSPEND_UPDATE_EXPECTED_DIGESTS: ${{ matrix.target == 'windows-x86_64' && needs.validate-prepared.outputs.windows-digests || needs.validate-prepared.outputs.macos-digests }}
          PREPARATION_TARGET: ${{ matrix.target }}
        run: node tools/prepare-update-artifacts.mjs sign
      - name: Independently verify exact signatures and hashes
        env:
          PREPARATION_TARGET: ${{ matrix.target }}
        run: node tools/prepare-update-artifacts.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: signed-1.3.1-${{ matrix.target }}
          path: prepared-signed/
          if-no-files-found: error
          retention-days: 14
