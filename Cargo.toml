[workspace]
resolver = "2"
members = ["core", "src-tauri"]
exclude = ["core/vendor/office_oxide"]

# Argon2 is deliberately slow. Unoptimized it takes many seconds per call in debug and test
# builds, which would make every unlock (and every e2e run) crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Preserve the PDF-compatible Office API while taking ZIP security fixes. See core/vendor/office_oxide/PATCHES.md.
[patch.crates-io]
office_oxide = { path = "core/vendor/office_oxide" }
